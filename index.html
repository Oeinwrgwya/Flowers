<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ball Battle</title>
<style>
  :root {
    --bg: #101219;
    --panel: #1b2030;
    --edge: #3a4460;
    --text: #f2f4fa;
    --muted: #a3adc4;
    --blue: #2f7bff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, #1c2236, var(--bg) 70%);
    color: var(--text);
    font-family: system-ui, sans-serif;
  }
  #wrap { position: relative; width: min(100vw, 800px); }
  canvas#game {
    display: block;
    width: 100%;
    background: #171a22;
    border: 3px solid var(--edge);
    border-radius: 8px;
    box-shadow: 0 14px 44px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(47, 123, 255, 0.25);
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 12px;
    border-radius: 8px;
    background: rgba(10, 12, 18, 0.86);
    backdrop-filter: blur(3px);
  }
  #overlay.hidden { display: none; }
  #title { margin: 0; font-size: clamp(1.4rem, 5vw, 2.2rem); text-shadow: 0 3px 12px rgba(47, 123, 255, 0.55); }
  #options { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 190px;
    padding: 14px 12px 16px;
    color: var(--text);
    background: linear-gradient(180deg, #262d44, var(--panel));
    border: 2px solid var(--edge);
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    font: inherit;
    cursor: pointer;
  }
  .card:hover {
    border-color: var(--blue);
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(47, 123, 255, 0.4);
  }
  .card:focus-visible, .btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  .card canvas { width: 120px; height: 120px; }
  .card strong { font-size: 1.2rem; }
  .card span { font-size: 0.85rem; color: var(--muted); text-align: center; }
  .btn {
    padding: 12px 28px;
    font: inherit;
    font-size: 1.1rem;
    color: var(--text);
    background: transparent;
    border: 2px solid var(--blue);
    border-radius: 8px;
    box-shadow: 0 0 18px rgba(47, 123, 255, 0.35);
    cursor: pointer;
  }
  .btn:hover { background: var(--blue); }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .card:hover { transform: none; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="500"></canvas>
  <div id="overlay">
    <h2 id="title"></h2>
    <div id="options"></div>
  </div>
</div>

<!-- Kolejność ma znaczenie: config -> arena -> klasy -> game -->
<script src="js/config.js"></script>
<script src="js/arena.js"></script>
<script src="js/classes/sword.js"></script>
<script src="js/classes/bow.js"></script>
<script src="js/game.js"></script>
</body>
</html>
